name: Publicar sitio en GitHub Pages

# Solo ejecución manual; subir commits no publica el sitio.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Mantener la publicación limitada a la rama principal.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Configurar Node para comprobaciones sin dependencias
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Comprobar contenido y respaldo estático
        run: |
          node --check dist/js/app.js
          node --test tests/content.test.cjs
          node scripts/sync-content.cjs --check

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir exclusivamente dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
